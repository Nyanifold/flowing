[project]
name = "flowing-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "croniter>=6.2.4",
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "jinja2>=3.1.6",
    # mcp：已随 2.x 迁移，不设版本上界；未来 3.x 若再破坏需重新评估。
    # httpx2 仅供 streamable-http 型工具的 headers 通道（mcp 2.x 的
    # http_client 参数要求 httpx2 客户端）。
    "mcp>=2.0.0",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
flowing = "flowing.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-json-report>=1.5.0",
]
docs = [
    "myst-parser>=5.1,<6",
    "sphinx>=9.1,<10",
    "sphinx-rtd-theme>=3.1,<4",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "flowing"
module-root = ""

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
