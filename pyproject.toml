[project]
name = "flowing-agent"
version = "0.1.0"
description = "A lightweight, extensible, descriptive agent runtime framework"
authors = [{ name = "Nyanifold" }]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "croniter>=6.2.4",
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "jinja2>=3.1.6",
    # mcp：已随 2.x 迁移，不设版本上界；未来 3.x 若再破坏需重新评估。
    # httpx2 仅供 streamable-http 型工具的 headers 通道（mcp 2.x 的
    # http_client 参数要求 httpx2 客户端）。
    "mcp>=2.0.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Repository = "https://github.com/Nyanifold/flowing"
Documentation = "https://flowing-agent.readthedocs.io/"
Issues = "https://github.com/Nyanifold/flowing/issues"

[project.scripts]
flowing = "flowing.interfaces.cli:main"
flowing-config = "flowing.config_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-json-report>=1.5.0",
]
docs = [
    "myst-parser>=5.1,<6",
    "sphinx>=9.1,<10",
    "sphinx-rtd-theme>=3.1,<4",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "flowing"
module-root = ""

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
