# provider entry: one entry = one API key identity.
# {{env.VAR}} is substituted at load time; when missing it becomes an empty
# string with a warnings.warn warning, and loading continues uninterrupted.
deepseek:
  adapter: deepseek
  base_url: https://api.deepseek.com
  api_key: "{{env.DEEPSEEK_API_KEY}}"
