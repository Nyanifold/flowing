# Build both language trees with the repository's Sphinx wrapper.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - python docs/build_docs.py --clean
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a docs/_build/html/. "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

# Declares the Sphinx setup; the custom HTML job above runs the bilingual
# build_docs.py instead of Sphinx's default single-source build.
sphinx:
  configuration: docs/conf.py
